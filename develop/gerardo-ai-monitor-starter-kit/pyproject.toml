[project]
name = "gerardo-ai-monitor"
version = "0.1.0"
description = "Local AI activity dashboard"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40,<2", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
